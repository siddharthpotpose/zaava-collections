<div class="delete-confirm-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <section class="delete-confirm-modal" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <div class="delete-confirm-header">
      <h6 class="mb-0">{{ title }}</h6>
    </div>

    <div class="delete-confirm-body">
      <p class="mb-0">{{ message }}</p>
    </div>

    <div class="delete-confirm-actions">
      <button type="button" class="admin-btn-secondary compact-btn" (click)="onNo()">No</button>
      <button type="button" class="admin-btn-danger compact-btn" (click)="onYes()">Yes</button>
    </div>
  </section>
</div>
