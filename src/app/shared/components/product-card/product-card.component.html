<div class="card h-100 product-card card-shadow zen-card">
  <a [routerLink]="['/products', product.id]" class="product-image-wrap">
    <img [src]="product.images[0]" [alt]="product.title" class="card-img-top product-image" />
  </a>

  <div class="card-body d-flex flex-column">
    <h6 class="card-title mb-1 text-truncate" [title]="product.title">{{ product.title }}</h6>
    <p class="text-muted-small mb-2">{{ product.brand }}</p>

    <div class="mb-2 d-flex align-items-center gap-2">
      <span class="fw-semibold">{{ discountPrice | currency: 'INR' }}</span>
      <span class="text-decoration-line-through text-muted-small">{{ product.price | currency: 'INR' }}</span>
      <span class="text-success fw-semibold">{{ product.discountPercentage }}% off</span>
    </div>

    <div class="mb-3">
      <span class="rating-badge"><i class="fa-solid fa-star me-1"></i>{{ product.rating }}</span>
    </div>

    <button type="button" class="btn btn-sm btn-add-cart mt-auto" (click)="addToCart.emit(product)">
      <i class="fa-solid fa-cart-plus me-2"></i>Add to Cart
    </button>
  </div>
</div>
