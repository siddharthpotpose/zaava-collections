<section class="admin-card card-shadow">
  <div class="admin-section-header">
    <h2 class="section-title mb-0">Carousel Master</h2>
    <button class="admin-btn-primary" type="button" (click)="openAddModal()">
      <i class="fa-solid fa-plus me-2"></i>Add Slide
    </button>
  </div>

  <div class="table-responsive" *ngIf="banners$ | async as banners">
    <table class="table align-middle mb-0 admin-table">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Title</th>
          <th>CTA</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let banner of banners">
          <td><img [src]="banner.image" [alt]="banner.title" class="banner-thumb" /></td>
          <td>
            <div class="fw-semibold">{{ banner.title }}</div>
            <div class="text-muted-small">{{ banner.subtitle }}</div>
          </td>
          <td>
            <div class="fw-semibold">{{ banner.ctaLabel }}</div>
            <div class="text-muted-small">{{ banner.ctaLink }}</div>
          </td>
          <td>
            <div class="admin-actions">
              <button class="admin-action-btn admin-btn-secondary" type="button" (click)="openEditModal(banner)">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="admin-action-btn admin-btn-danger" type="button" (click)="deleteBanner(banner.id)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<div class="modal fade admin-modal" #bannerModal tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ editingBannerId ? 'Edit Slide' : 'Add Slide' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="admin-form-label">Title</label>
              <input class="form-control admin-form-control" formControlName="title" />
            </div>
            <div class="col-md-6">
              <label class="admin-form-label">CTA Label</label>
              <input class="form-control admin-form-control" formControlName="ctaLabel" />
            </div>
            <div class="col-12">
              <label class="admin-form-label">Subtitle</label>
              <textarea class="form-control admin-form-control" rows="2" formControlName="subtitle"></textarea>
            </div>
            <div class="col-12">
              <label class="admin-form-label">Image URL</label>
              <input class="form-control admin-form-control" formControlName="image" />
            </div>
            <div class="col-12">
              <label class="admin-form-label">CTA Link (example: /products?category=Saree)</label>
              <input class="form-control admin-form-control" formControlName="ctaLink" />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="admin-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="admin-btn-primary">Save Slide</button>
        </div>
      </form>
    </div>
  </div>
</div>
