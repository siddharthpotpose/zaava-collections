<section class="admin-card card-shadow">
  <div class="admin-section-header">
    <h2 class="section-title mb-0">Category Master</h2>
    <button class="admin-btn-primary" type="button" (click)="openAddModal()">
      <i class="fa-solid fa-plus me-2"></i>Add Category
    </button>
  </div>

  <div class="table-responsive" *ngIf="categories$ | async as categories">
    <table class="table align-middle mb-0 admin-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Slug</th>
          <th>Parent</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let category of categories">
          <td>
            <div class="d-flex align-items-center gap-2">
              <img [src]="category.image" [alt]="category.name" class="thumb" />
              <div class="fw-semibold"><i class="fa-solid me-2" [ngClass]="category.icon"></i>{{ category.name }}</div>
            </div>
          </td>
          <td>{{ category.slug }}</td>
          <td>{{ category.parentCategory || '-' }}</td>
          <td>
            <span class="badge" [class.text-bg-success]="category.featured" [class.text-bg-secondary]="!category.featured">
              {{ category.featured ? 'Yes' : 'No' }}
            </span>
          </td>
          <td>
            <div class="admin-actions">
              <button class="admin-action-btn admin-btn-secondary" type="button" (click)="openEditModal(category)">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="admin-action-btn admin-btn-danger" type="button" (click)="deleteCategory(category.id)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<div class="modal fade admin-modal" #categoryModal tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ editingCategoryId ? 'Edit Category' : 'Add Category' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="admin-form-label">Category Name</label>
              <input class="form-control admin-form-control" formControlName="name" />
            </div>
            <div class="col-md-6">
              <label class="admin-form-label">Slug</label>
              <input class="form-control admin-form-control" formControlName="slug" placeholder="banarasi-saree" />
            </div>
            <div class="col-md-6">
              <label class="admin-form-label">Icon (FontAwesome class)</label>
              <input class="form-control admin-form-control" formControlName="icon" placeholder="fa-gem" />
            </div>
            <div class="col-md-6">
              <label class="admin-form-label">Parent Category</label>
              <select class="form-select admin-form-select" formControlName="parentCategory">
                <option value="">None</option>
                <option
                  *ngFor="let category of categories$ | async"
                  [value]="category.name"
                  [disabled]="shouldHideParentOption(category.name)"
                >
                  {{ category.name }}
                </option>
              </select>
            </div>
            <div class="col-12">
              <label class="admin-form-label">Category Image URL</label>
              <input class="form-control admin-form-control" formControlName="image" />
            </div>
            <div class="col-12 form-check form-switch ms-2">
              <input class="form-check-input" type="checkbox" formControlName="featured" id="featuredToggle" />
              <label class="form-check-label" for="featuredToggle">Show in website quick category strip</label>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="admin-btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="admin-btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>
</div>
