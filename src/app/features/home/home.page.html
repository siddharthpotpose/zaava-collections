<section class="home-hero mb-4" *ngIf="banners$ | async as banners">
  <div #heroCarouselEl id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-pause="false">
    <div class="carousel-indicators">
      <button
        *ngFor="let banner of banners; let index = index"
        type="button"
        data-bs-target="#heroCarousel"
        [attr.data-bs-slide-to]="index"
        [class.active]="index === 0"
      ></button>
    </div>

    <div class="carousel-inner rounded-4 overflow-hidden card-shadow">
      <div class="carousel-item" [class.active]="index === 0" *ngFor="let banner of banners; let index = index">
        <img [src]="banner.image" class="d-block w-100 hero-img" [alt]="banner.title" />
        <div class="carousel-caption text-start">
          <span class="badge text-bg-light mb-2">Trending Collection</span>
          <h2>{{ banner.title }}</h2>
          <p>{{ banner.subtitle }}</p>
          <button class="btn btn-warning" type="button" (click)="openBannerLink(banner.ctaLink)">
            {{ banner.ctaLabel }}
          </button>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</section>

<section class="mb-4 p-3 rounded-4 card-shadow">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="section-title mb-0">Women Categories</h2>
    <a routerLink="/products" class="btn btn-outline-primary btn-sm">View All Products</a>
  </div>

  <div class="row g-3" *ngIf="categories$ | async as categories">
    <div class="col-6 col-md-4 col-lg-3 col-xxl-2" *ngFor="let category of categories">
      <a class="category-tile zen-card" [routerLink]="['/products']" [queryParams]="{ category: category.name }">
        <img [src]="category.image" [alt]="category.name" class="category-image mb-2" />
        <div class="fw-semibold"><i class="fa-solid me-2" [ngClass]="category.icon"></i>{{ category.name }}</div>
      </a>
    </div>
  </div>
</section>

<section class="mb-4 p-3 rounded-4 card-shadow">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="section-title mb-0">Saree Spotlight</h2>
    <a [routerLink]="['/products']" [queryParams]="{ category: 'Saree' }" class="btn btn-outline-primary btn-sm">
      Explore Sarees
    </a>
  </div>

  <div class="row g-3" *ngIf="sareeFocus$ | async as sarees">
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let product of sarees">
      <app-product-card [product]="product" (addToCart)="addToCart($event)"></app-product-card>
    </div>
  </div>
</section>

<section class="p-3 rounded-4 card-shadow">
  <h2 class="section-title">All Category Collections</h2>

  <div class="mb-4" *ngFor="let row of categoryRows$ | async">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">{{ row.category.name }}</h5>
      <a [routerLink]="['/products']" [queryParams]="{ category: row.category.name }" class="btn btn-outline-primary btn-sm">
        View All
      </a>
    </div>

    <div class="category-products-scroll" *ngIf="row.products.length > 0; else emptyCategoryRow">
      <div class="category-product-item" *ngFor="let product of row.products">
        <app-product-card [product]="product" (addToCart)="addToCart($event)"></app-product-card>
      </div>
    </div>

    <ng-template #emptyCategoryRow>
      <div class="empty-category-row text-muted-small">No products available in this category.</div>
    </ng-template>
  </div>
</section>
