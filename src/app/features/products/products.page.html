<section class="p-3 rounded-4 card-shadow">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="section-title mb-0">All Products</h2>
    <span class="text-muted-small">Live products from API with category filtering</span>
  </div>

  <div class="filters  mb-3">
    <button class="btn btn-sm me-2 mb-2 btn-outline-dark" type="button" (click)="selectCategory(null)">All</button>
    <button class="btn btn-sm me-2 mb-2 btn-outline-primary category-pill" type="button" *ngFor="let category of topLevelCategories()"
      (click)="selectCategory(category.categoryName)">
      {{ category.categoryName }}
    </button>
  </div>

  <div class="row g-3" *ngIf="filteredProducts() as products">
    <div class="col-12 text-center py-5" *ngIf="products.length === 0">
      <h5>No products found for this filter.</h5>
    </div>
    <div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let product of products">
      <app-product-card [product]="product" (addToCart)="addToCart($event)"></app-product-card>
    </div>
  </div>
</section>
